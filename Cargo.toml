[workspace]
resolver = "2"
members = ["hashigo", "saihai-spec", "saihai-forge", "bancadad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pleme-io/saihai"
rust-version = "1.89"

[workspace.dependencies]
tatara-lisp = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hashigo = { path = "hashigo", version = "0.1.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
