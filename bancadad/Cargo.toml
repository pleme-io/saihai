[package]
name = "bancadad"
description = "The daemon that holds a declared pleme-io desktop at its declared shape."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
saihai-spec = { path = "../saihai-spec", version = "0.1.0" }
saihai-forge = { path = "../saihai-forge", version = "0.1.0" }
# From the registry, not a path: shikumi lives in its own repo, so a path dep
# resolves on this workstation and nowhere else. 0.1.594 is published.
shikumi = "0.1"
serde = { workspace = true }
serde_json = "1"

# ── lava's convergence engine ─────────────────────────────────────────
# bancada does not run its own loop. lava-viggy is the fleet's published
# seven-beat engine, and two convergence engines in one fleet is exactly the
# duplication this substrate exists to remove.
lava-viggy = "0.1"
lava-drift = "0.1"
lava-outcome-chain = "0.1"
lava-anomaly = "0.1"
indexmap = "2"
chrono = { version = "0.4", features = ["serde"] }
